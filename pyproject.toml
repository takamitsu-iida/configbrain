[project]
name = "configbrain"
version = "0.1.0"
description = "Evidence-backed network configuration generation from official documentation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "llama-index-core>=0.12,<1.0",
    "openai>=1.0,<2.0",
    "pymupdf>=1.24,<2.0",
    "pydantic-settings>=2.6,<3.0",
    "qdrant-client>=1.12,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
